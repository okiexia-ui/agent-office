<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <title>Agent Office · 暂时离线</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --paper: #f5f4ef; --ink: #22281f; --muted: #6f7868; --accent: #e8794f; }
    @media (prefers-color-scheme: dark) { :root { --paper: #181d19; --ink: #eef0e8; --muted: #a3ab9c; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: var(--paper); color: var(--ink); font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { margin: 18px 0 6px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 22px; color: var(--muted); }
    button { border: 0; border-radius: 999px; padding: 11px 22px; background: var(--accent); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon.svg" alt="">
    <h1>暂时连不上办公室</h1>
    <p>网络恢复后就能继续群聊和查看成果。已经发出的消息不会丢失，未确认的消息可以在重新连接后重试。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
